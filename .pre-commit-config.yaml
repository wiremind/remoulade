default_language_version:
  python: python3.14
exclude: ^env/
repos:
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.79
    hooks:
      - id: ty
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
